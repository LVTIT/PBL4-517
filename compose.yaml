name: ${LOCAL_COMPOSE_PROJECT:-pbl517}
services:
  db:
    image: postgres:16
    container_name: ${LOCAL_DB_CONTAINER:-pbl517-db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run dev.ps1 setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run dev.ps1 setup first}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  database:
    name: ${LOCAL_DB_VOLUME:-pbl517-local-data}
    external: true
